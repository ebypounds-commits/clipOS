name: baseline-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate repository handoff
        run: python3 scripts/validate_handoff.py
      - name: Run M-1 preflight
        run: bash scripts/preflight.sh
      - name: Test agent lease behavior
        run: python3 scripts/test_agent_lease.py
      - name: Scan tracked files for secrets
        run: bash scripts/secret_scan.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -e "services/api[dev]"
      - name: Lint API
        run: ruff check services/api
      - name: Run API tests
        run: pytest -q services/api
      - name: Validate development compose
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web typecheck
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npx tsc --noEmit

  report:
    needs: [validate, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write and publish CI result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            result=success
          else
            result=failure
          fi
          {
            printf 'status=%s\n' "$result"
            printf 'run=%s\n' '${{ github.run_id }}'
            printf 'sha=%s\n' '${{ github.sha }}'
          } > last_run.txt
          git add last_run.txt
          git diff --cached --quiet || git -c user.name=ci-bot -c user.email=ci-bot@clipos.local commit -m "ci: record last run"
          git_repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          auth_url="$(printf '%s' "$git_repo_url" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")"
          git push --force "$auth_url" HEAD:ci-results
