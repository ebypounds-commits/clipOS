name: baseline-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate repository handoff
        run: python3 scripts/validate_handoff.py
      - name: Run M-1 preflight
        run: bash scripts/preflight.sh
      - name: Test agent lease behavior
        run: python3 scripts/test_agent_lease.py
      - name: Scan tracked files for secrets
        run: bash scripts/secret_scan.sh
      - name: Validate build state and architecture
        run: |
          python3 scripts/validate_state.py
          python3 scripts/architecture_guard.py
      - name: Validate task packets and state audit
        run: |
          python3 scripts/validate_packet.py .agent/CODEX_TASK_PACKET_TEMPLATE.md
          python3 scripts/state_audit.py verify

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip (audited component) then install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"
      - name: Formatting check
        run: ruff format --check services/api
      - name: Lint API
        run: ruff check services/api
      - name: Static type check
        run: mypy services/api/clipos_api
      - name: Validate development compose
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Start development infrastructure
        run: docker compose -f docker-compose.dev.yml up -d
      - name: Wait for infrastructure health
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            if bash scripts/infrastructure_health.sh; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            docker compose -f docker-compose.dev.yml ps || true
            exit 1
          fi
      - name: Confirm infrastructure health
        run: bash scripts/infrastructure_health.sh
      - name: Run API migrations (lane 5)
        env:
          DATABASE_URL: postgresql+psycopg://clipos_dev:clipos_dev_local_only@localhost:5433/clipos_dev
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Run API tests with coverage (lane 5 PostgreSQL DB tests)
        env:
          DATABASE_URL: postgresql+psycopg://clipos_dev:clipos_dev_local_only@localhost:5433/clipos_dev
          STORAGE_ENDPOINT: http://localhost:9002
          STORAGE_ACCESS_KEY: clipos_dev
          STORAGE_SECRET_KEY: clipos_dev_local_only
          STORAGE_BUCKET: clipos-test
          CACHE_REDIS_URL: redis://localhost:6380/0
          TEMPORAL_ADDRESS: localhost:7233
        run: |
          set -o pipefail
          pytest -q services/api 2>&1 | tee pytest_output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          retention-days: 7
      - name: Integration smoke (PostgreSQL, Redis, MinIO)
        run: bash scripts/integration_smoke.sh
      - name: Stop development infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Web typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip (audited component) then install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"
      - name: Python dependency vulnerability audit
        run: bash scripts/dependency_audit.sh
      - name: Generate Python SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py env --output-reproducible -o sbom/api-python.cdx.json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@v4
        with:
          name: api-python-sbom
          path: sbom/api-python.cdx.json
      - name: Export and check OpenAPI contract
        run: |
          set -euo pipefail
          PYTHONPATH=services/api python3 -c "import json; from clipos_api.main import app; json.dump(app.openapi(), open('openapi.json','w'), indent=2)"
          python3 -c "import json; spec = json.load(open('openapi.json', encoding='utf-8')); assert '/health' in spec['paths'], 'missing /health path'"
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: npm audit (high and above fails)
        working-directory: apps/web
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build application images
        run: docker compose -f docker-compose.dev.yml --profile app build
      - name: E2E API smoke
        run: bash scripts/e2e_smoke.sh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend production build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

  report:
    needs: [validate, test, quality, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pytest output
        uses: actions/download-artifact@v4
        with:
          name: pytest-output
        continue-on-error: true
      - name: Write and publish CI result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.quality.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
            result=success
          else
            result=failure
          fi
          {
            printf 'status=%s\n' "$result"
            printf 'run=%s\n' '${{ github.run_id }}'
            printf 'sha=%s\n' '${{ github.sha }}'
            printf 'jobs=validate:%s,test:%s,quality:%s,build:%s\n' \
              '${{ needs.validate.result }}' '${{ needs.test.result }}' \
              '${{ needs.quality.result }}' '${{ needs.build.result }}'
          } > last_run.txt
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "failure_log_begin" >> last_run.txt
            grep -E "^(FAILED|ERROR) " pytest_output.txt 2>/dev/null | head -30 >> last_run.txt || true
            grep -B2 -A8 "^(FAILED|ERROR)" pytest_output.txt 2>/dev/null | head -60 >> last_run.txt || true
            echo "failure_log_end" >> last_run.txt
          fi
          git add last_run.txt
          git diff --cached --quiet || git -c user.name=ci-bot -c user.email=ci-bot@clipos.local commit -m "ci: record last run"
          git_repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          auth_url="$(printf '%s' "$git_repo_url" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")"
          git push --force "$auth_url" HEAD:ci-results
