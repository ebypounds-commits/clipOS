# Local development services only. Passwords are intentionally non-production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clipos_dev
      POSTGRES_PASSWORD: clipos_dev_local_only
      POSTGRES_DB: clipos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipos_dev -d clipos_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipos_dev
      MINIO_ROOT_PASSWORD: clipos_dev_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./services/api
    environment:
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
    environment:
      NODE_ENV: development
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
