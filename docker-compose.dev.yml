# Local development services only. Passwords are intentionally non-production.
name: clipos-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: clipos_dev
      POSTGRES_PASSWORD: clipos_dev_local_only
      POSTGRES_DB: clipos_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipos_dev -d clipos_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest  # upstream minio/minio removed from public registries (2026); bitnamilegacy = last published public image
    restart: "no"
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipos_dev
      MINIO_ROOT_PASSWORD: clipos_dev_local_only
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: "no"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: clipos_dev
      POSTGRES_PWD: clipos_dev_local_only
      POSTGRES_SEEDS: postgres
      POSTGRES_DB: temporal
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i | cut -d' ' -f1):7233 2>/dev/null | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  temporal-ui:
    image: temporalio/ui:2.55.0
    restart: "no"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8088"
    ports:
      - "8233:8088"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: ["app"]
    restart: "no"
    build:
      context: ./services/api
    environment:
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    profiles: ["app"]
    restart: "no"
    build:
      context: ./apps/web
    environment:
      NODE_ENV: development
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
