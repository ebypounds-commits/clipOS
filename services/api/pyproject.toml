[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipos-api"
version = "0.1.0"
description = "ClipOS control-plane API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "uvicorn>=0.30",
  "boto3>=1.34",
  "redis>=5.0",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "cyclonedx-bom>=6.0",
]

[tool.setuptools]
packages = ["clipos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clipos_api --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"