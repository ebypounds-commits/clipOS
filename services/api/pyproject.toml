[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipos-api"
version = "1.0.0"
description = "ClipOS control-plane API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1",
  "pydantic==2.14.1",
  "sqlalchemy==2.14.1",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "boto3==1.43.113",
  "redis==8.1.0",
  "temporalio==1.34.0",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "cyclonedx-bom>=6.0",
]

[tool.setuptools]
packages = ["clipos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clipos_api --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"